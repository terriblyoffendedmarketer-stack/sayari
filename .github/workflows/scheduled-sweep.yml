name: Sayari Compliance Radar & Cloud Listening

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours in the cloud
  workflow_dispatch:        # Allows manual 1-click trigger in GitHub Actions UI
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sweep-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests beautifulsoup4 feedparser praw pytest

      - name: Run Compliance Listening Pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python run.py pipeline || echo "Pipeline sweep finished with non-fatal warnings"

      - name: Commit and Push Updated Signal Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sayari.db ideas.csv ideas.md raw_items.csv glossary.csv blocked_sources.md reports/ docs/ viewer/
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar): automated cloud sweep [skip ci]"
            git push origin master
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
