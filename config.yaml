    - "spreadsheets and google"
    - "backlog"
    - "clearing alerts"
    - "queue"
    - "l1 review"
    - "first-line review"
    - "disposition"
    - "disposition alerts"
    - "adverse media"
    - "manual review"
    - "frankenstack"
    - "point solutions"
    - "fragmented systems"
    - "disconnected systems"
    - "entity resolution"
    - "investigation"

customer_proof_points:
  no3_global_telecom:
    stat: "72% of flagged risk was on no watchlist anywhere, hidden in nested ownership (60K+ partners screened continuously)"
    approved_for: "Product as relief, Receipts"
  fortune50_energy_supermajor:
    stat: "1.2M records screened in real time (competing platform required 24–48 hours)"
    approved_for: "Product as relief"
  fortune50_energy_company:
    stat: "75+ data sources collapsed into one solution; costly homegrown system retired"
    approved_for: "Frankenstack reckoning, Product as relief"
  top5_global_tech_company:
    stat: "Chose Sayari over supply-chain incumbent for sub-tier mapping"
    approved_for: "Receipts, Product as relief"

industry_benchmarks:
  false_positives: "90% to 95% false positives in sanctions screening (vendor-reported benchmark)"
  spreadsheets_usage: "Over 25% manage periodic reviews mainly in spreadsheets (vendor-run survey)"
  google_adverse_media: "65% rely on Google for manual adverse media searches"

filter_rules:
  drop_patterns:
    - "resume review"
    - "cams exam"
    - "cams certification"
    - "study guide"
    - "how to break into"
    - "entry level salary"
    - "job interview"
    - "passed cams"
    - "course discount"
    - "promo code"
    - "we just launched"
    - "check out our tool"
    - "check out my tool"
    - "we built a tool"
    - "new product"
    - "schedule a demo"
    - "book a demo"
    - "free trial"
    - "try it free"
    - "sign up at"
    - "visit our website"
    - "register for our webinar"
    - "upcoming webinar"
    - "we are hiring"
    - "job opening"
    - "apply now"
    - "referral link"
    - "discount code"
    - "special offer"
    - "whitepaper download"
  # Exception: keep career/exam posts if they mention actual daily-work frustrations
  frustration_exception_words:
    - "nightmare"
    - "swivel chair"
    - "drowning"
    - "backlog"
    - "frustration"
    - "broken"
    - "tedious"
    - "unrealistic"
    - "audit panic"

formats:
  pain_mirror:
    target_share: 0.35
    pillar: "The Frankenstack Reckoning"
    description: "Memes or realistic fake artifacts that name the daily grind ('that's literally my job')"
  product_as_relief:
    target_share: 0.25
    pillar: "The Frankenstack Reckoning"
    description: "Before/after with the source document attached, never a tutorial ('wait, you can just do that?')"
  the_receipts:
    target_share: 0.20
    pillar: "The risk hiding in plain sight"
    description: "A real case mapped as a carousel; ownership chains, shell companies, public enforcement teardowns"
  newsjack:
    target_share: 0.20
    pillar: "A score is not a defense"
    description: "Headline-to-lesson newsjack, two-line compliance takeaway on live news, relief instead of fear"

llm_clustering:
  enabled: true
  provider: "ollama" # ollama or local_tfidf
  ollama_url: "http://localhost:11434"
  ollama_model: "qwen2.5-coder:7b" # fallback to gemma3:4b or tfidf
