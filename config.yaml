# config.yaml — Configuration for Sayari LinkedIn Research Tool
# All sources, keywords, filters, format targets, and paths are editable here.

database:
  path: "data/sayari.db"

storage:
  raw_items_csv: "raw_items.csv"
  ideas_csv: "ideas.csv"
  ideas_md: "ideas.md"
  glossary_csv: "glossary.csv"
  blocked_sources_md: "blocked_sources.md"
  manual_import_dir: "data/imports"
  html_viewer_dir: "viewer"

privacy_and_compliance:
  store_usernames: false
  max_excerpt_words: 25
  respect_robots_txt: true
  user_agent: "SayariContentResearch/1.0 (Non-commercial research tool for B2B compliance content analysis)"

reddit:
  # Official Reddit API credentials (register at https://www.reddit.com/prefs/apps)
  # Free tier covers non-commercial personal scripts (100 queries/min via OAuth)
  client_id: ""
  client_secret: ""
  user_agent: "SayariContentResearch/1.0 by NonCommercialResearcher"
  subreddits:
    - "AMLCompliance"
    - "financialcrime"
    - "compliance"
    - "RegulatoryCompliance"
  skip_flairs:
    - "vendor"
    - "promotion"
    - "advertisement"
    - "promo"
    - "commercial"
    - "product"
    - "demo"
    - "job"
    - "hiring"
    - "career"
  skip_title_patterns:
    - "weekly promo"
    - "self-promotion"
    - "vendor showcase"
    - "monthly recruitment"
  limit_per_sub: 25
  cache_responses: true

rss_sources:
  major:
    - name: "ACAMS moneylaundering.com"
      url: "https://www.moneylaundering.com/feed/"
      enabled: true
    - name: "Compliance Week"
      url: "https://www.complianceweek.com/rss"
      enabled: true
    - name: "Global Trade Review"
      url: "https://www.gtreview.com/feed/"
      enabled: true
    - name: "FCPA Blog"
      url: "https://fcpablog.com/feed/"
      enabled: true
  independent:
    - name: "FiveBy Risk News & Insights (Substack)"
      url: "https://fiveby.substack.com/feed"
      enabled: true
    - name: "AML Intelligence"
      url: "https://www.amlintelligence.com/feed/"
      enabled: true
    - name: "Steptoe International Compliance Blog"
      url: "https://www.steptoeinternationalcomplianceblog.com/feed/"
      enabled: true
    - name: "Holland & Hart Trade Sanctions"
      url: "https://www.tradesanctions.com/feed/"
      enabled: true
    - name: "Export Control Navigator"
      url: "https://exportcontrolnavigator.substack.com/feed"
      enabled: true

keywords:
  seed_keywords:
    - "compliance"
    - "regulatory compliance"
    - "aml"
    - "anti-money laundering"
    - "sanctions"
    - "sanction"
    - "sanctions screening"
    - "alert fatigue"
    - "alert volume"
    - "alerts"
    - "alert queue"
    - "burnout"
    - "turnover"
    - "swivel chair"
    - "swivel chair effect"
    - "false positive"
    - "false positives"
    - "name matching"
    - "settlement"
    - "penalty"
    - "fined"
    - "enforcement"
    - "whistleblower"
    - "fincen"
    - "kyc"
    - "kyb"
    - "pkyc"
    - "perpetual kyc"
    - "kyc refresh"
    - "periodic review"
    - "due diligence"
    - "cdd"
    - "edd"
    - "ubo"
    - "nested ownership"
    - "beneficial ownership"
    - "third-party risk"
    - "tprm"
    - "supplier screening"
    - "sub-tier mapping"
    - "sub-tier"
    - "uflpa"
    - "forced labor"
    - "ofac"
    - "itar"
    - "outbound investment"
    - "export control"
    - "export controls"
    - "trade compliance"
    - "transshipment"
    - "shell company"
    - "shell companies"
    - "audit"
    - "audit trail"
    - "regulator exam"
    - "regulatory exam"
