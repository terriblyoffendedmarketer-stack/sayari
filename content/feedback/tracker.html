<title>Sayari Learning Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one readable column; rounds as sections, comparison tables scroll sideways on phones. */
:root{--paper:#FAF8F4;--surface:#FFFFFF;--ink:#1D2440;--muted:#6A6760;--line:#E6E1D7;--gold:#C57F27;--chip:#EFEBE3;
  --ok:#2F6B4F;--ok-soft:#E3EFE8;--warn:#8A5A12;--warn-soft:#F7ECD8;--idle:#5E6475;--idle-soft:#E9EAEF;
  --display:"Merriweather",Georgia,serif;--body:"Inter",-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141A2E;--surface:#1D2440;--ink:#F1ECE2;--muted:#A9A69F;--line:#2E3654;--gold:#F4B941;--chip:#262E4D;
  --ok:#8FD1AE;--ok-soft:#1F3A30;--warn:#F2C877;--warn-soft:#3B3020;--idle:#B4B9C9;--idle-soft:#2A3150;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141A2E;--surface:#1D2440;--ink:#F1ECE2;--muted:#A9A69F;--line:#2E3654;--gold:#F4B941;--chip:#262E4D;
  --ok:#8FD1AE;--ok-soft:#1F3A30;--warn:#F2C877;--warn-soft:#3B3020;--idle:#B4B9C9;--idle-soft:#2A3150;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1.2 var(--display);margin:6px 0 4px;text-wrap:balance}
h2{font:700 21px/1.3 var(--display);margin:36px 0 10px;padding-top:20px;border-top:1px solid var(--line);text-wrap:balance}
h3{font:600 16px/1.35 var(--body);margin:22px 0 8px;color:var(--gold)}
p,li{max-width:72ch} ul,ol{padding-left:20px}
code{font:13px var(--mono);background:var(--chip);padding:1px 5px;border-radius:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
.st{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.st.applied,.st.done,.st.closed{background:var(--ok-soft);color:var(--ok)} .st.testing,.st.in{background:var(--warn-soft);color:var(--warn)} .st.open,.st.noted{background:var(--idle-soft);color:var(--idle)}
footer{color:var(--muted);font-size:13px;margin-top:40px}
</style>
<div class="wrap"><div class="eyebrow">Private · our learnings from client feedback</div><div id="doc"></div><footer id="foot"></footer></div>
<script>
const MD = "# Learning tracker (private: not shown in the Content Hub)\n\nWhat reviewers changed, why, and the rule we take from it. Newest round at the top. Each lesson is marked with where it's been applied, so a rule never lives only here.\nStatus: `applied` (written into a rule file) · `testing` (trying on the next posts) · `open` (needs an answer)\n\n---\n\n## Round 1 · Ekshika · 2026-11-10 · P01–P04\nEkshika = our account manager (freelance); she liaises with Sayari. She edited P01 and P03 herself before sending them to Sayari. **Her revision notes apply to all four**, so P02 and P04 are reworked by us under these rules.\n\n**Her words:** \"all your creatives are too verbose and difficult to comprehend. when creating these, try to use simple language and treat your audience like idiots.\" / \"we need to think in that direction for both copy and creatives.\" / \"the goal here is to offload this from me so you take complete ownership of the posts.\"\n**What she means (our working reading):** assume the reader has **zero context and zero patience**. They should get it in 2 seconds without thinking. Simple words, one idea, the point stated outright.\nFiles: `assets/2026-11-10_ekshika-creatives-P01-P03.jpg`, `assets/2026-11-10_ekshika-captions-P01-P03.jpg`, crops `assets/P01-final-ekshika-edit.jpg`, `assets/P03-final-ekshika-edit.jpg`.\n\n### P01 · name match: caption cut from ~110 words to ~25\n| Ours | Hers |\n|---|---|\n| \"Potential match.\" Translation joke → what the tool didn't do → registries + 7 Google searches → your name on the file → Sayari \"one entity, with the source records attached\" → P.S. wink | The three spellings. \"Same company? Maybe. Different company? Also maybe.\" \"If you hate falling down the name-matching rabbit hole, we can help!\" |\n**What changed:** she kept only the joke the image already makes, plus one plain, friendly CTA. No explaining the job back to the reader, no product description, no P.S.\n**Lessons:**\n1. **When the image carries the joke, the caption just echoes it and closes.** It doesn't re-explain the pain. `applied` (CAPTIONS.md)\n2. **The brand line can be one plain sentence** (\"we can help!\") rather than a feature description. `applied`\n3. The creative itself passed unchanged: the visual mechanic (three spellings + \"same company?\") was simple enough. `noted`\n\n### P03 · 25% + 25%: creative heavily rewritten\n| Element | Ours | Hers | Why hers is clearer |\n|---|---|---|---|\n| Headline | \"25% + 25% = a sanctioned company.\" | \"Two 'clean' 25% owners don't make a clean company.\" | Plain-language conclusion. Ours was a puzzle that needs the 50% rule to decode. |\n| Questionnaire card | Small grey note: \"Signed by the supplier. Not checked against anything.\" | Red rubber stamp: **TAKING THEIR WORD FOR IT** | A visual label says the point instantly; a sentence needs reading. |\n| Registry panel | A list in mono: Owner A 25% / blocked, Owner B 25% / blocked, \"Together: 50% → the company is blocked too\" | Two side-by-side boxes (big 25% + BLOCKED tag) joined by lines into a red result bar: **\"Result: 50% blocked. You just onboarded a violation.\"** | The maths is *drawn* (two parts → one sum). The consequence is said to *you*, in plain words. |\n| Extra detail | \"Section 4\", \"Registry record ·\" | Removed | Detail labels are noise at 2-second reading. |\n| Takeaway | None on the image | Bottom line: \"Know who you're doing business with, **not who they say they are**.\" | The image ends on the moral, so it works without the caption. |\n| Colour | Red only in small pills | Red stamp + red result bar | Risk red used boldly to carry meaning (within the design system's `risk` token). |\n**Lessons:**\n4. **Headline = the conclusion in plain words**, not a riddle or formula. `applied` (kit README, CAPTIONS.md)\n5. **Show the logic visually**: stamps, boxes that add up, a result bar. Don't describe it in sentences. `applied` (kit README)\n6. **Spell out the consequence for the reader** (\"You just onboarded a violation\"). `applied`\n7. **End the image on a one-line takeaway**, so it stands alone without the caption. `applied`\n8. **Cut metadata labels** (section numbers, \"registry record ·\", dates) unless they carry meaning. `applied`\n9. Use risk red **boldly when it carries the meaning**. `testing`\n\n### P03 · caption: rewritten shorter and plainer (~150 → ~110 words)\n| Ours (v1) | Hers |\n|---|---|\n| \"25% + 25% = a sanctioned company. / Wait. What? / Yep…\" · \"Now the fun part.\" · \"Everyone went to lunch.\" · \"Forms don't do math.\" · documents promise vs record · Sayari reads the registry… · CTA question · P.S. | Hook: **\"Self-attestation is just a trust fall with your compliance budget.\"** · \"A supplier checks 'No'… sign it, you file it, case closed, right? Not quite.\" · \"A quick look at the corporate registry tells a different story:\" + two bullet lines · two sentences on the 50% rule and the blind spot · \"Sayari maps ownership structures down to the ultimate beneficial owner so you aren't relying on a vendor's word to protect your supply chain.\" · P.S. kept |\n**What changed:** one strong metaphor as the hook instead of a chain of beats; a simple story arc (form → \"not quite\" → registry → why → Sayari); bullets for the facts; she cut our stacked jokes (\"Wait. What?\", \"Now the fun part\", \"went to lunch\", \"Forms don't do math\") and the CTA question.\n**Lessons:**\n10. **One strong personality move beats four small ones.** A single sharp metaphor (\"a trust fall with your compliance budget\") carries the voice. `applied` (CAPTIONS.md: max one move)\n11. **Facts as bullets, story as short lines**: scannable beats clever. `applied`\n12. **The Sayari line can be concrete and benefit-led** (\"so you aren't relying on a vendor's word\"). `applied`\n13. Note: she kept some jargon (\"self-attestation\", \"ultimate beneficial owner\"), so plain doesn't mean jargon-free. It means **few ideas, clearly ordered**. `noted`\n\n### Open questions\n- P02 (bingo) and P04 (PURE carousel): she didn't edit them, but the notes apply. **Reworked by us on 2026-11-11** (see below). `done`\n\n### Applying round 1 to P02 and P04 (our rework, 2026-11-11)\n| Post | Before | After | Rule applied |\n|---|---|---|---|\n| P02 image | \"Frankenstack bingo\"; squares with attributions (\"– the analyst on his 5th Red Bull\", \"Your manager, 5:58pm\", \"The auditor, 8 months later\") | \"Compliance bingo\"; every square 2–6 words, no attributions | Plain words (practitioners don't say \"Frankenstack\"); 2-second test |\n| P02 caption | ~140 words, Frankenstack explained, auditor story, Sayari paragraph | ~40 words: the 5:58 pm moment, count your squares, \"It's not you. It's your tools.\", one Sayari line, drop your count | Short; one personality move; brand as one benefit line |\n| P04 slides | Two lines plus a body sentence per slide; ending \"A name search tells you if the name is on a list. It doesn't tell you who owns it.\" + question | One short line per slide; diagram does the explaining; ending \"Don't just check the name. Check who owns it.\" | Show, don't tell; plain conclusion; takeaway line |\n| P04 captions | ~150 words each | ~70 words each | Length rule |\nOur pre-rework versions: `content/posts/archive/2026-11-10_round1-originals/`.\n\n### The user rejected my P02 rework (2026-11-11), and why\n\"This version you made is not nice… nothing really tells me anything or makes the user feel anything.\" Reverted to the original, keeping only these tweaks: Compliance (not Frankenstack) bingo · \"Be honest\" trimmed · \"Holding co.\" · quick one without the attribution · \"Blames the intern.\" · \"Session expired. Mid-case.\" · \"System says clear. Google says no.\"\n**Lessons:**\n14. **\"Simple\" ≠ \"fewer words\".** I cut by word count and stripped the parts that carried meaning and feeling. `applied`\n15. **Attributions carry context.** \"How did you decide this?\" only lands with \"The auditor, 8 months later\". Keep the *who* when the line needs it. `applied`\n16. **Keep the human, specific details** (the 5th Red Bull): they make people feel something. Simplicity removes *confusion*, not *character*. `applied`\n17. **Keep visual jokes** (the drawn search bars); they're the opposite of verbose. `applied`\n18. **Diagnose before rewriting.** Work out what actually confused the reader (here: insider shorthand like OoO and Frankenstack), fix only that, and ask before broad rewrites. `applied`\n- The P01 creative was used as ours; only the caption changed. `closed`\n\n### The distilled rules (now in the rule files)\n- **2-second test:** someone with zero context gets the image in 2 seconds and the caption's point in one read.\n- **Image:** plain-language headline (the conclusion) · logic shown visually · consequence stated to \"you\" · a takeaway line at the bottom · no metadata noise.\n- **Caption:** single image ~30–90 words; carousel ~60–120 · one idea · max one personality move · facts as bullets · plain CTA · the brand line is one concrete benefit sentence.\n", BUILT = "2026-11-10 16:27";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline = t => esc(t).replace(/`(applied|testing|open|noted|done|closed|in progress)`/g,(m,w)=>`<span class="st ${w.split(" ")[0]}">${w}</span>`)
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
function md(src){ const L=src.split("\n"); let h="",i=0;
  while(i<L.length){ const l=L[i];
    if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length; h+=`<h${n}>${inline(l.replace(/^#+ /,""))}</h${n}>`; i++; continue;}
    if(/^---\s*$/.test(l)){i++; continue;}
    if(l.startsWith("|")){const rows=[]; while(i<L.length&&L[i].startsWith("|")){ if(!/^\|[-| :]+\|$/.test(L[i])) rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|")); i++;}
      h+=`<div class="tablewrap"><table><thead><tr>${rows[0].map(c=>`<th>${inline(c.trim())}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inline(c.trim())}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue;}
    if(/^(- |\d+\. )/.test(l)){const ol=/^\d+\. /.test(l); let it=""; while(i<L.length&&/^(- |\d+\. )/.test(L[i])){it+=`<li>${inline(L[i].replace(/^(- |\d+\. )/,""))}</li>`; i++;} h+=ol?`<ol>${it}</ol>`:`<ul>${it}</ul>`; continue;}
    if(l.trim()) h+=`<p>${inline(l)}</p>`; i++; }
  return h; }
document.getElementById("doc").innerHTML = md(MD).replace("<h1>","<h1>").replace(/<h1>[^<]*<\/h1>/,"<h1>Sayari Learning Tracker</h1>");
document.getElementById("foot").textContent = `Built ${BUILT} from content/feedback/LEARNING_TRACKER.md (scripts/build_tracker.py).`;
</script>
